version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Nest packages depend on each other's major version, so they have to move together
      nestjs:
        patterns: ['@nestjs/*']
      jest:
        patterns: ['jest', '@types/jest', 'ts-jest']
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (the native compiler) is not supported by ts-jest and typescript-eslint yet
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
